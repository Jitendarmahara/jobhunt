apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "career-system.fullname" . }}
data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
---
{{- $fullName := include "career-system.fullname" . -}}
{{- range $name, $component := dict "api" .Values.api "worker" .Values.worker "dashboard" .Values.dashboard }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}-{{ $name }}
  labels: { app.kubernetes.io/name: {{ $fullName }}, app.kubernetes.io/component: {{ $name }} }
spec:
  replicas: {{ $component.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $fullName }}, app.kubernetes.io/component: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $fullName }}, app.kubernetes.io/component: {{ $name }} }
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $component.image | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: {{ $fullName }} }
            {{- if $.Values.existingSecret }}
            - secretRef: { name: {{ $.Values.existingSecret }} }
            {{- end }}
          {{- if eq $name "dashboard" }}
          env:
            - name: API_UPSTREAM
              value: {{ printf "%s-api" $fullName | quote }}
          {{- end }}
          resources: {{ toYaml (index $.Values.resources $name) | nindent 12 }}
          {{- if eq $name "api" }}
          ports: [{ name: http, containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
          {{- else if eq $name "dashboard" }}
          ports: [{ name: http, containerPort: 80 }]
          {{- end }}
---
{{- if ne $name "worker" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-{{ $name }}
spec:
  type: {{ $component.service.type }}
  selector: { app.kubernetes.io/name: {{ $fullName }}, app.kubernetes.io/component: {{ $name }} }
  ports: [{ name: http, port: {{ $component.service.port }}, targetPort: http }]
---
{{- end }}
{{- end }}
